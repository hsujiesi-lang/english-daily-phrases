<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英文練習">
<meta name="theme-color" content="#0a1628">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>English Daily Phrases Practice</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a1628;
  color: #e0e0e0;
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
.app {
  max-width: 480px;
  margin: 0 auto;
  padding: 16px;
  padding-top: max(16px, env(safe-area-inset-top));
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  min-height: 100vh;
  min-height: 100dvh;
}

/* Nav tabs */
.nav {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.nav button {
  flex: 1;
  min-width: 80px;
  padding: 10px 6px;
  border: 1px solid #2a3a5c;
  background: #121e36;
  color: #8899bb;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.nav button.active {
  background: #1a3a6a;
  color: #5bf;
  border-color: #5bf;
}

/* Progress bar */
.progress-bar {
  width: 100%;
  height: 6px;
  background: #1a2a4a;
  border-radius: 3px;
  margin-bottom: 8px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #2d7, #5bf);
  border-radius: 3px;
  transition: width 0.3s;
}
.progress-text {
  text-align: center;
  font-size: 13px;
  color: #6a8ab0;
  margin-bottom: 16px;
}

/* Card */
.card {
  background: #121e36;
  border: 1px solid #1e3050;
  border-radius: 16px;
  padding: 24px 20px;
  margin-bottom: 16px;
}
.card-sentence {
  font-size: 20px;
  color: #f0f0f0;
  line-height: 1.5;
  margin-bottom: 8px;
}
.card-zh {
  font-size: 14px;
  color: #6a8ab0;
  margin-bottom: 16px;
}

/* Audio controls */
.audio-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}
.btn-play {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 2px solid #5bf;
  background: transparent;
  color: #5bf;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.btn-play:hover { background: #1a3a6a; }
.speed-btn {
  padding: 4px 10px;
  border: 1px solid #2a3a5c;
  background: #0e1a30;
  color: #8899bb;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
}
.speed-btn.active { border-color: #5bf; color: #5bf; }

/* Shadowing label */
.badge-row {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 12px;
}
.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}
.badge-listen { background: #1a3a6a; color: #5bf; }
.badge-speak { background: #2a1a3a; color: #d8b4fe; }

/* Input area */
.input-area {
  position: relative;
  margin-bottom: 16px;
}
.input-area input, .input-area textarea {
  width: 100%;
  padding: 14px 16px;
  background: #0e1a30;
  border: 1px solid #2a3a5c;
  border-radius: 12px;
  color: #f0f0f0;
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s;
}
.input-area input:focus, .input-area textarea:focus {
  border-color: #5bf;
}
.input-area textarea {
  resize: none;
  min-height: 60px;
}

/* Buttons */
.btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 10px;
}
.btn-primary {
  background: linear-gradient(135deg, #1a5a9a, #2a7acc);
  color: white;
}
.btn-primary:hover { background: linear-gradient(135deg, #2a6aaa, #3a8add); }
.btn-success {
  background: linear-gradient(135deg, #1a7a4a, #2d7);
  color: white;
}
.btn-mic {
  background: #2a1a3a;
  color: #d8b4fe;
  border: 1px solid #4a2a6a;
}
.btn-mic.recording {
  background: #5a1a3a;
  color: #ff6b8a;
  border-color: #ff6b8a;
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,107,138,0.3); }
  50% { box-shadow: 0 0 0 10px rgba(255,107,138,0); }
}
.btn-secondary {
  background: #1a2a4a;
  color: #8899bb;
  border: 1px solid #2a3a5c;
}
.btn-skip {
  background: transparent;
  color: #6a8ab0;
  border: 1px solid #2a3a5c;
}

/* Result */
.result-box {
  background: #0e1a30;
  border: 1px solid #2a3a5c;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}
.result-label {
  font-size: 13px;
  color: #6a8ab0;
  margin-bottom: 8px;
}
.result-text {
  font-size: 16px;
  line-height: 1.6;
}
.correct { color: #2d7; }
.incorrect { color: #ff6b8a; text-decoration: underline; }
.word-correct { color: #2d7; }
.word-incorrect { color: #ff6b8a; background: rgba(255,107,138,0.15); padding: 2px 4px; border-radius: 4px; }
.word-missing { color: #6a8ab0; text-decoration: line-through; }

/* Score badge */
.score-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
}
.score-perfect { background: #1a4a2a; color: #2d7; }
.score-good { background: #3a3a1a; color: #ed2; }
.score-poor { background: #4a1a1a; color: #ff6b8a; }

/* Fill blank */
.fill-sentence {
  font-size: 18px;
  line-height: 2;
  color: #f0f0f0;
  margin-bottom: 16px;
}
.blank-slot {
  display: inline-block;
  min-width: 120px;
  border-bottom: 2px dashed #5bf;
  padding: 2px 4px;
  margin: 0 4px;
  color: #5bf;
  font-weight: 600;
}
.blank-input {
  display: inline-block;
  background: transparent;
  border: none;
  border-bottom: 2px solid #5bf;
  color: #5bf;
  font-size: 18px;
  font-weight: 600;
  width: 180px;
  padding: 2px 4px;
  outline: none;
  font-family: inherit;
}

/* Unit filter */
.unit-filter {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.unit-chip {
  padding: 6px 12px;
  border: 1px solid #2a3a5c;
  background: #121e36;
  color: #8899bb;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.unit-chip.active {
  background: #1a3a6a;
  color: #5bf;
  border-color: #5bf;
}

/* Show answer link */
.show-answer {
  text-align: center;
  margin-top: 8px;
}
.show-answer a {
  color: #5bf;
  font-size: 13px;
  cursor: pointer;
  text-decoration: underline;
}

/* Celebration */
.celebration {
  text-align: center;
  padding: 20px;
}
.celebration .emoji {
  font-size: 48px;
  margin-bottom: 12px;
}

/* Home screen */
.home-card {
  background: #121e36;
  border: 1px solid #1e3050;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.home-card:hover {
  border-color: #5bf;
  transform: translateY(-2px);
}
.home-card h3 {
  color: #5bf;
  font-size: 16px;
  margin-bottom: 6px;
}
.home-card p {
  color: #6a8ab0;
  font-size: 13px;
}
.home-title {
  text-align: center;
  margin-bottom: 24px;
}
.home-title h1 {
  font-size: 22px;
  color: #5bf;
  margin-bottom: 4px;
}
.home-title p {
  color: #6a8ab0;
  font-size: 13px;
}

/* Stats */
.stats-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}
.stat-box {
  flex: 1;
  background: #121e36;
  border: 1px solid #1e3050;
  border-radius: 12px;
  padding: 12px;
  text-align: center;
}
.stat-num {
  font-size: 24px;
  font-weight: 700;
  color: #5bf;
}
.stat-label {
  font-size: 11px;
  color: #6a8ab0;
}

/* Hide */
.hidden { display: none !important; }

/* Mobile touch improvements */
button, .home-card { -webkit-touch-callout: none; touch-action: manipulation; }
.btn { min-height: 50px; }
.btn-play { min-width: 50px; min-height: 50px; }
.input-area input, .input-area textarea { font-size: 16px; /* prevents iOS zoom */ }
.blank-input { font-size: 16px; min-width: 100px; }

/* Bottom safe area spacer */
.bottom-spacer { height: max(20px, env(safe-area-inset-bottom)); }

/* Haptic feedback visual */
.btn:active { transform: scale(0.97); }
.home-card:active { transform: scale(0.98); }

/* Mobile install banner */
.install-banner {
  background: linear-gradient(135deg, #1a3a6a, #2a5a9a);
  border-radius: 12px;
  padding: 14px 16px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.install-banner p { font-size: 13px; color: #d0e0f0; flex: 1; }
.install-banner button {
  padding: 8px 16px;
  background: #5bf;
  color: #0a1628;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

/* Hint text */
.hint-text {
  font-size: 13px;
  color: #6a8ab0;
  margin-top: 6px;
}

/* Tag */
.tag {
  display: inline-block;
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  margin-right: 4px;
  margin-bottom: 4px;
}
.tag-unit { background: #1a2a4a; color: #5bf; }
.tag-study { background: #2a1a3a; color: #d8b4fe; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>

  // Unit 1: Meeting new friends

// State
let state = {
  mode: 'home', // home, shadow, fillblank, fullsentence, extended
  currentIndex: 0,
  queue: [],
  score: {correct: 0, total: 0},
  speed: 0.75,
  selectedUnits: [],
  showResult: false,
  userAnswer: '',
  recognized: '',
  isRecording: false,
};

const units = [...new Set(phrases.map(p => p.unit))];

// ============ RENDER ============
function render() {
  const app = document.getElementById('app');
  switch(state.mode) {
    case 'home': app.innerHTML = renderHome(); break;
    case 'shadow': app.innerHTML = renderShadow(); break;
    case 'fillblank': app.innerHTML = renderFillBlank(); break;
    case 'fullsentence': app.innerHTML = renderFullSentence(); break;
    case 'extended': app.innerHTML = renderExtended(); break;
  }
  bindEvents();
}

function renderHome() {
  const totalPracticed = parseInt(localStorage.getItem('totalPracticed') || '0');
  const bestStreak = parseInt(localStorage.getItem('bestStreak') || '0');
  return `
    <div class="home-title">
      <h1>English Daily Phrases</h1>
      <p>克雷英文高頻句練習 App</p>
    </div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-num">${phrases.length}</div><div class="stat-label">總句數</div></div>
      <div class="stat-box"><div class="stat-num">${totalPracticed}</div><div class="stat-label">已練習</div></div>
      <div class="stat-box"><div class="stat-num">${bestStreak}</div><div class="stat-label">最佳連續</div></div>
    </div>
    <div class="home-card" onclick="startMode('shadow')">
      <h3>1. 跟讀練習</h3>
      <p>聽音檔 → 跟讀 → 語音辨識糾正發音</p>
    </div>
    <div class="home-card" onclick="startMode('fillblank')">
      <h3>2. 填空練習</h3>
      <p>看中文提示，填入正確的英文關鍵字</p>
    </div>
    <div class="home-card" onclick="startMode('fullsentence')">
      <h3>3. 完整句子聽寫</h3>
      <p>聽完整句子，打出完整英文</p>
    </div>
    <div class="home-card" onclick="startMode('extended')">
      <h3>4. 留學生活情境造句</h3>
      <p>用 I'm gonna / I've been 等句型 + 留學生活細節</p>
    </div>
  `;
}

function getQueue(prioritizeStudyAbroad) {
  let pool = [...phrases];
  if (state.selectedUnits.length > 0) {
    pool = pool.filter(p => state.selectedUnits.includes(p.unit));
  }
  if (prioritizeStudyAbroad) {
    const sa = pool.filter(p => p.studyAbroad);
    const other = pool.filter(p => !p.studyAbroad);
    // 70% study abroad, 30% other
    const saCount = Math.min(sa.length, Math.ceil(pool.length * 0.7));
    const otherCount = pool.length - saCount;
    pool = shuffle(sa).slice(0, saCount).concat(shuffle(other).slice(0, otherCount));
  }
  return shuffle(pool);
}

function startMode(mode) {
  state.mode = mode;
  state.queue = getQueue(true);
  state.currentIndex = 0;
  state.score = {correct: 0, total: 0};
  state.showResult = false;
  state.userAnswer = '';
  state.recognized = '';
  render();
}

// ============ SHADOW MODE ============
function renderShadow() {
  if (state.currentIndex >= state.queue.length) return renderComplete();
  const p = state.queue[state.currentIndex];
  const progress = ((state.currentIndex) / Math.min(state.queue.length, 12)) * 100;
  const qNum = state.currentIndex + 1;
  const total = Math.min(state.queue.length, 12);

  let resultHTML = '';
  if (state.showResult) {
    const comparison = compareWords(state.recognized, p.en);
    const scorePercent = comparison.score;
    const badgeClass = scorePercent >= 90 ? 'score-perfect' : scorePercent >= 60 ? 'score-good' : 'score-poor';
    const badgeIcon = scorePercent >= 90 ? '&#10004;' : scorePercent >= 60 ? '~' : '&#10008;';
    resultHTML = `
      <div class="result-box">
        <div class="result-label">參考答案：</div>
        <div class="result-text" style="margin-bottom:12px">${p.en}</div>
        <div class="audio-row">
          <button class="speed-btn ${state.speed===0.75?'active':''}" onclick="setSpeed(0.75)">0.75X</button>
          <button class="speed-btn ${state.speed===0.5?'active':''}" onclick="setSpeed(0.5)">0.5X</button>
          <button class="btn-play" onclick="speakText('${escapeJS(p.en)}')">&#9654;</button>
        </div>
        <div class="hint-text">點一下紅色底線的字查看提示</div>
      </div>
      <div class="score-badge ${badgeClass}">${badgeIcon} ${comparison.correctWords}/${comparison.totalWords} · ${scorePercent}%</div>
      <div class="show-answer"><a onclick="showMyAnswer()">顯示我剛剛說的</a></div>
      <div id="my-answer" class="hidden" style="margin-top:8px">
        <div class="result-box">
          <div class="result-label">你說的：</div>
          <div class="result-text">${comparison.html}</div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="nextQuestion()" style="margin-top:12px">下一題 &#8594;</button>
    `;
  }

  return `
    <button class="btn btn-skip" onclick="goHome()" style="width:auto;padding:8px 16px;margin-bottom:12px">&#8592; 返回</button>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="progress-text">${qNum}/${total} 題 · 完成 ${state.score.correct} 題</div>
    <div class="card">
      <div class="badge-row">
        <span class="badge badge-listen">跟讀</span>
        <span class="tag tag-unit">${p.unit}</span>
        ${p.studyAbroad ? '<span class="tag tag-study">留學生活</span>' : ''}
      </div>
      <div class="card-sentence">${p.en}</div>
      <div class="card-zh">${p.zh}</div>
      <div class="audio-row">
        <button class="btn-play" onclick="speakText('${escapeJS(p.en)}')" title="播放">&#9654;</button>
        <span style="color:#6a8ab0;font-size:13px">&#128266; ${state.speed}x</span>
        <button class="speed-btn ${state.speed===0.75?'active':''}" onclick="setSpeed(0.75)">0.75X</button>
        <button class="speed-btn ${state.speed===0.5?'active':''}" onclick="setSpeed(0.5)">0.5X</button>
      </div>
    </div>
    ${!state.showResult ? `
      <button class="btn btn-mic ${state.isRecording ? 'recording' : ''}" onclick="toggleRecording()">
        ${state.isRecording ? '&#9899; 錄音中... 點擊停止' : '&#127908; 開始跟讀（語音辨識）'}
      </button>
      <div class="input-area">
        <input type="text" id="shadow-input" placeholder="或在此打字輸入你聽到的..." value="${escapeHTML(state.userAnswer)}" oninput="state.userAnswer=this.value">
      </div>
      <button class="btn btn-primary" onclick="checkShadow()">確認送出</button>
      <button class="btn btn-skip" onclick="skipQuestion()">跳過</button>
    ` : resultHTML}
  `;
}

// ============ FILL BLANK MODE ============
function renderFillBlank() {
  if (state.currentIndex >= Math.min(state.queue.length, 12)) return renderComplete();
  const p = state.queue[state.currentIndex];
  const progress = ((state.currentIndex) / Math.min(state.queue.length, 12)) * 100;
  const qNum = state.currentIndex + 1;

  // Create blanks: hide key words
  const words = p.en.split(' ');
  const blankIndices = getBlankIndices(words);

  let sentenceHTML = '';
  let blankCount = 0;
  words.forEach((w, i) => {
    if (blankIndices.includes(i)) {
      if (state.showResult) {
        const userWord = (state.userAnswer.split(',')[blankCount] || '').trim();
        const clean = w.replace(/[.,!?;:'"]/g, '');
        const isCorrect = userWord.toLowerCase() === clean.toLowerCase();
        sentenceHTML += `<span class="${isCorrect ? 'word-correct' : 'word-incorrect'}">${w}</span> `;
      } else {
        sentenceHTML += `<input class="blank-input" data-idx="${blankCount}" placeholder="___" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"> `;
      }
      blankCount++;
    } else {
      sentenceHTML += w + ' ';
    }
  });

  let resultHTML = '';
  if (state.showResult) {
    const answers = state.userAnswer.split(',');
    let correctCount = 0;
    blankIndices.forEach((bi, i) => {
      const clean = words[bi].replace(/[.,!?;:'"]/g, '');
      if ((answers[i] || '').trim().toLowerCase() === clean.toLowerCase()) correctCount++;
    });
    const percent = Math.round((correctCount / blankIndices.length) * 100);
    const badgeClass = percent >= 90 ? 'score-perfect' : percent >= 60 ? 'score-good' : 'score-poor';
    resultHTML = `
      <div class="score-badge ${badgeClass}">&#10004; ${correctCount}/${blankIndices.length} · ${percent}%</div>
      <button class="btn btn-primary" onclick="nextQuestion()">下一題 &#8594;</button>
    `;
  }

  return `
    <button class="btn btn-skip" onclick="goHome()" style="width:auto;padding:8px 16px;margin-bottom:12px">&#8592; 返回</button>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="progress-text">${qNum}/${Math.min(state.queue.length, 12)} 題</div>
    <div class="card">
      <div class="badge-row">
        <span class="badge badge-listen">填空</span>
        <span class="tag tag-unit">${p.unit}</span>
      </div>
      <div class="card-zh" style="font-size:16px;margin-bottom:16px">${p.zh}</div>
      <div class="fill-sentence">${sentenceHTML}</div>
      <div class="audio-row">
        <button class="btn-play" onclick="speakText('${escapeJS(p.en)}')" title="播放提示">&#9654;</button>
        <span style="color:#6a8ab0;font-size:13px">聽音提示</span>
      </div>
    </div>
    ${!state.showResult ? `
      <button class="btn btn-primary" onclick="checkFillBlank()">確認答案</button>
      <button class="btn btn-skip" onclick="skipQuestion()">跳過</button>
    ` : resultHTML}
  `;
}

// ============ FULL SENTENCE MODE ============
function renderFullSentence() {
  if (state.currentIndex >= Math.min(state.queue.length, 12)) return renderComplete();
  const p = state.queue[state.currentIndex];
  const progress = ((state.currentIndex) / Math.min(state.queue.length, 12)) * 100;
  const qNum = state.currentIndex + 1;

  let resultHTML = '';
  if (state.showResult) {
    const comparison = compareWords(state.userAnswer, p.en);
    const scorePercent = comparison.score;
    const badgeClass = scorePercent >= 90 ? 'score-perfect' : scorePercent >= 60 ? 'score-good' : 'score-poor';
    resultHTML = `
      <div class="result-box">
        <div class="result-label">正確答案：</div>
        <div class="result-text">${p.en}</div>
      </div>
      <div class="result-box">
        <div class="result-label">你的答案：</div>
        <div class="result-text">${comparison.html}</div>
      </div>
      <div class="score-badge ${badgeClass}">&#10004; ${comparison.correctWords}/${comparison.totalWords} · ${scorePercent}%</div>
      <div class="audio-row" style="margin-top:12px">
        <button class="btn-play" onclick="speakText('${escapeJS(p.en)}')">&#9654;</button>
        <span style="color:#6a8ab0;font-size:13px">再聽一次</span>
      </div>
      <button class="btn btn-primary" onclick="nextQuestion()">下一題 &#8594;</button>
    `;
  }

  return `
    <button class="btn btn-skip" onclick="goHome()" style="width:auto;padding:8px 16px;margin-bottom:12px">&#8592; 返回</button>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="progress-text">${qNum}/${Math.min(state.queue.length, 12)} 題</div>
    <div class="card">
      <div class="badge-row">
        <span class="badge badge-listen">聽寫</span>
        <span class="tag tag-unit">${p.unit}</span>
      </div>
      <div class="card-zh" style="font-size:16px;margin-bottom:16px">${p.zh}</div>
      <div class="audio-row">
        <button class="btn-play" onclick="speakText('${escapeJS(p.en)}')" title="播放">&#9654;</button>
        <span style="color:#6a8ab0;font-size:13px">&#128266; 聽句子後打出完整英文</span>
      </div>
    </div>
    ${!state.showResult ? `
      <div class="input-area">
        <textarea id="full-input" placeholder="打出你聽到的完整英文句子..." oninput="state.userAnswer=this.value">${escapeHTML(state.userAnswer)}</textarea>
      </div>
      <button class="btn btn-primary" onclick="checkFullSentence()">確認送出</button>
      <button class="btn btn-skip" onclick="skipQuestion()">跳過</button>
    ` : resultHTML}
  `;
}

// ============ EXTENDED SENTENCE MODE ============
function renderExtended() {
  if (state.currentIndex >= extendedSentences.length) return renderComplete();
  const group = extendedSentences[state.currentIndex];
  const detail = group.details[Math.floor(Math.random() * group.details.length)];
  // Store current detail for checking
  if (!state._currentDetail) state._currentDetail = detail;
  const progress = ((state.currentIndex) / extendedSentences.length) * 100;

  let resultHTML = '';
  if (state.showResult) {
    const comparison = compareWords(state.userAnswer, state._currentDetail);
    const scorePercent = comparison.score;
    const badgeClass = scorePercent >= 90 ? 'score-perfect' : scorePercent >= 60 ? 'score-good' : 'score-poor';
    resultHTML = `
      <div class="result-box">
        <div class="result-label">參考句子：</div>
        <div class="result-text">${state._currentDetail}</div>
      </div>
      <div class="result-box">
        <div class="result-label">你的答案：</div>
        <div class="result-text">${comparison.html}</div>
      </div>
      <div class="score-badge ${badgeClass}">${comparison.correctWords}/${comparison.totalWords} · ${scorePercent}%</div>
      <div class="audio-row" style="margin-top:12px">
        <button class="btn-play" onclick="speakText('${escapeJS(state._currentDetail)}')">&#9654;</button>
        <span style="color:#6a8ab0;font-size:13px">聽參考句子</span>
      </div>
      <div style="margin-top:12px">
        <div class="result-label">更多範例：</div>
        ${group.details.map(d => `<div style="color:#8899bb;font-size:14px;margin:4px 0">· ${d}</div>`).join('')}
      </div>
      <button class="btn btn-primary" onclick="nextExtended()" style="margin-top:12px">下一題 &#8594;</button>
    `;
  }

  return `
    <button class="btn btn-skip" onclick="goHome()" style="width:auto;padding:8px 16px;margin-bottom:12px">&#8592; 返回</button>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="progress-text">${state.currentIndex + 1}/${extendedSentences.length} 組句型</div>
    <div class="card">
      <div class="badge-row">
        <span class="badge badge-speak">情境造句</span>
        <span class="tag tag-study">留學生活</span>
      </div>
      <div class="card-sentence" style="color:#5bf;font-size:22px">"${group.base}..."</div>
      <div class="card-zh" style="margin-top:12px">請用 <strong>${group.base}</strong> 開頭，造一個跟留學生活有關的句子</div>
      <div class="audio-row" style="margin-top:12px">
        <button class="btn-play" onclick="speakText('${escapeJS(state._currentDetail)}')" title="聽範例">&#9654;</button>
        <span style="color:#6a8ab0;font-size:13px">聽範例句子</span>
      </div>
    </div>
    ${!state.showResult ? `
      <div class="input-area">
        <textarea id="ext-input" placeholder="用 ${group.base} 造一個完整句子..." oninput="state.userAnswer=this.value">${escapeHTML(state.userAnswer)}</textarea>
      </div>
      <button class="btn btn-primary" onclick="checkExtended()">確認送出</button>
      <button class="btn btn-skip" onclick="skipQuestion()">跳過</button>
    ` : resultHTML}
  `;
}

function renderComplete() {
  const total = state.score.total;
  const correct = state.score.correct;
  const percent = total > 0 ? Math.round((correct / total) * 100) : 0;
  // Save stats
  const prev = parseInt(localStorage.getItem('totalPracticed') || '0');
  localStorage.setItem('totalPracticed', prev + total);
  return `
    <div class="celebration">
      <div class="emoji" style="font-size:64px">&#127881;</div>
      <h2 style="color:#5bf;margin-bottom:8px">練習完成！</h2>
      <p style="color:#6a8ab0;margin-bottom:24px">你完成了 ${total} 題練習</p>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num">${correct}</div><div class="stat-label">答對</div></div>
        <div class="stat-box"><div class="stat-num">${total - correct}</div><div class="stat-label">答錯</div></div>
        <div class="stat-box"><div class="stat-num">${percent}%</div><div class="stat-label">正確率</div></div>
      </div>
      <button class="btn btn-primary" onclick="startMode('${state.mode}')">再練一次</button>
      <button class="btn btn-secondary" onclick="goHome()">回首頁</button>
    </div>
  `;
}

// ============ ACTIONS ============
function goHome() {
  state.mode = 'home';
  render();
}

function setSpeed(s) {
  state.speed = s;
  render();
}

function speakText(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = state.speed;
  // Try to get a good US English voice
  const voices = speechSynthesis.getVoices();
  const usVoice = voices.find(v => v.lang === 'en-US' && v.name.includes('Samantha'))
    || voices.find(v => v.lang === 'en-US')
    || voices.find(v => v.lang.startsWith('en'));
  if (usVoice) u.voice = usVoice;
  speechSynthesis.speak(u);
}

function toggleRecording() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('你的瀏覽器不支援語音辨識，請使用 Chrome 瀏覽器。');
    return;
  }
  if (state.isRecording) {
    if (window._recognition) window._recognition.stop();
    state.isRecording = false;
    render();
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const result = e.results[0][0].transcript;
    state.recognized = result;
    state.userAnswer = result;
    state.isRecording = false;
    render();
  };
  recognition.onerror = () => {
    state.isRecording = false;
    render();
  };
  recognition.onend = () => {
    state.isRecording = false;
  };
  recognition.start();
  window._recognition = recognition;
  state.isRecording = true;
  render();
}

function checkShadow() {
  const p = state.queue[state.currentIndex];
  const answer = state.userAnswer || state.recognized;
  if (!answer.trim()) { alert('請先跟讀或打字輸入！'); return; }
  state.recognized = answer;
  const comparison = compareWords(answer, p.en);
  state.score.total++;
  if (comparison.score >= 60) state.score.correct++;
  state.showResult = true;
  render();
}

function checkFillBlank() {
  const inputs = document.querySelectorAll('.blank-input');
  const answers = [];
  inputs.forEach(inp => answers.push(inp.value));
  state.userAnswer = answers.join(',');

  const p = state.queue[state.currentIndex];
  const words = p.en.split(' ');
  const blankIndices = getBlankIndices(words);
  let correct = 0;
  blankIndices.forEach((bi, i) => {
    const clean = words[bi].replace(/[.,!?;:'"]/g, '');
    if ((answers[i] || '').trim().toLowerCase() === clean.toLowerCase()) correct++;
  });
  state.score.total++;
  if (correct === blankIndices.length) state.score.correct++;
  state.showResult = true;
  render();
}

function checkFullSentence() {
  if (!state.userAnswer.trim()) { alert('請輸入完整句子！'); return; }
  const p = state.queue[state.currentIndex];
  const comparison = compareWords(state.userAnswer, p.en);
  state.score.total++;
  if (comparison.score >= 70) state.score.correct++;
  state.showResult = true;
  render();
}

function checkExtended() {
  if (!state.userAnswer.trim()) { alert('請輸入句子！'); return; }
  state.score.total++;
  const comparison = compareWords(state.userAnswer, state._currentDetail);
  if (comparison.score >= 50) state.score.correct++;
  state.showResult = true;
  render();
}

function nextQuestion() {
  state.currentIndex++;
  state.showResult = false;
  state.userAnswer = '';
  state.recognized = '';
  if (state.currentIndex >= Math.min(state.queue.length, 12)) {
    // Complete
  }
  render();
  // Auto-play next
  if (state.currentIndex < Math.min(state.queue.length, 12) && state.mode === 'shadow') {
    setTimeout(() => speakText(state.queue[state.currentIndex].en), 500);
  }
  if (state.currentIndex < Math.min(state.queue.length, 12) && state.mode === 'fullsentence') {
    setTimeout(() => speakText(state.queue[state.currentIndex].en), 500);
  }
}

function nextExtended() {
  state.currentIndex++;
  state.showResult = false;
  state.userAnswer = '';
  state._currentDetail = null;
  if (state.currentIndex < extendedSentences.length) {
    state._currentDetail = extendedSentences[state.currentIndex].details[
      Math.floor(Math.random() * extendedSentences[state.currentIndex].details.length)
    ];
  }
  render();
}

function skipQuestion() {
  state.score.total++;
  nextQuestion();
}

function showMyAnswer() {
  document.getElementById('my-answer')?.classList.toggle('hidden');
}

function bindEvents() {
  // Auto-focus inputs
  const inp = document.getElementById('shadow-input') || document.getElementById('full-input') || document.getElementById('ext-input');
  if (inp) setTimeout(() => inp.focus(), 100);

  // Enter key submit
  document.querySelectorAll('input, textarea').forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (state.mode === 'shadow') checkShadow();
        else if (state.mode === 'fillblank') checkFillBlank();
        else if (state.mode === 'fullsentence') checkFullSentence();
        else if (state.mode === 'extended') checkExtended();
      }
    });
  });
}

// ============ UTILITIES ============
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function escapeHTML(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeJS(s) {
  return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
}

function compareWords(userText, correctText) {
  const cleanUser = userText.toLowerCase().replace(/[.,!?;:'"]/g, '').trim().split(/\s+/);
  const cleanCorrect = correctText.toLowerCase().replace(/[.,!?;:'"]/g, '').trim().split(/\s+/);

  let correctCount = 0;
  const htmlParts = [];

  cleanCorrect.forEach((word, i) => {
    if (cleanUser.includes(word)) {
      correctCount++;
      htmlParts.push(`<span class="word-correct">${correctText.split(/\s+/)[i] || word}</span>`);
    } else {
      htmlParts.push(`<span class="word-incorrect">${cleanUser[i] ? cleanUser[i] : '___'}</span>`);
    }
  });

  return {
    score: Math.round((correctCount / cleanCorrect.length) * 100),
    correctWords: correctCount,
    totalWords: cleanCorrect.length,
    html: htmlParts.join(' '),
  };
}

function getBlankIndices(words) {
  // Pick ~40% of words to blank, skip very short words
  const candidates = [];
  words.forEach((w, i) => {
    const clean = w.replace(/[.,!?;:'"]/g, '');
    if (clean.length >= 3) candidates.push(i);
  });
  const count = Math.max(1, Math.ceil(candidates.length * 0.4));
  return shuffle(candidates).slice(0, count).sort((a, b) => a - b);
}

// Load voices
speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

// PWA Install prompt
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  render(); // re-render to show install banner
});

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => { deferredPrompt = null; render(); });
  }
}

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// Add install banner to home if available
const _origRenderHome = renderHome;
renderHome = function() {
  let html = _origRenderHome();
  // Show install tip on iOS Safari or Android
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (!isStandalone) {
    let bannerHTML = '';
    if (deferredPrompt) {
      bannerHTML = `<div class="install-banner">
        <p>安裝到手機主畫面，隨時練習！</p>
        <button onclick="installApp()">安裝 App</button>
      </div>`;
    } else if (isIOS) {
      bannerHTML = `<div class="install-banner">
        <p>點擊 Safari 底部的 <strong>分享</strong> 按鈕，然後選擇「<strong>加入主畫面</strong>」即可安裝。</p>
      </div>`;
    }
    // Insert after home-title
    html = html.replace('</div>\n    <div class="stats-row">', '</div>' + bannerHTML + '<div class="stats-row">');
  }
  return html;
};

// Init
render();
