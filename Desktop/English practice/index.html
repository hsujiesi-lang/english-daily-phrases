<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英文練習">

<title>120 Daily Phrases Practice</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a1628;color:#e0e0e0;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.app{max-width:480px;margin:0 auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom));min-height:100vh;min-height:100dvh}
button,.home-card{-webkit-touch-callout:none;touch-action:manipulation}
button:active{transform:scale(0.97)}

/* Progress */
.prog-bar{width:100%;height:6px;background:#1a2a4a;border-radius:3px;margin-bottom:8px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#2d7,#5bf);border-radius:3px;transition:width .3s}
.prog-text{text-align:center;font-size:13px;color:#6a8ab0;margin-bottom:16px}

/* Card */
.card{background:#121e36;border:1px solid #1e3050;border-radius:16px;padding:20px;margin-bottom:16px}
.card-lg{font-size:20px;color:#f0f0f0;line-height:1.5;margin-bottom:8px}
.card-zh{font-size:15px;color:#6a8ab0;margin-bottom:12px}
.card-sm{font-size:13px;color:#556;margin-bottom:8px}

/* Tags */
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-right:4px;margin-bottom:8px}
.b-blue{background:#1a3a6a;color:#5bf}
.b-purple{background:#2a1a3a;color:#d8b4fe}
.b-green{background:#1a4a2a;color:#2d7}
.b-orange{background:#4a3a1a;color:#fb3}
.b-cat{background:#1a2a4a;color:#8ab}

/* Audio */
.audio-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.btn-play{width:46px;height:46px;border-radius:50%;border:2px solid #5bf;background:transparent;color:#5bf;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-play:hover{background:#1a3a6a}
.spd{padding:4px 10px;border:1px solid #2a3a5c;background:#0e1a30;color:#8899bb;border-radius:6px;font-size:12px;cursor:pointer}
.spd.on{border-color:#5bf;color:#5bf}

/* Input */
.inp{width:100%;padding:14px 16px;background:#0e1a30;border:1px solid #2a3a5c;border-radius:12px;color:#f0f0f0;font-size:16px;outline:none;transition:border-color .2s;font-family:inherit}
.inp:focus{border-color:#5bf}
textarea.inp{resize:none;min-height:70px}

/* Buttons */
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:10px;min-height:50px}
.btn-p{background:linear-gradient(135deg,#1a5a9a,#2a7acc);color:#fff}
.btn-p:hover{background:linear-gradient(135deg,#2a6aaa,#3a8add)}
.btn-mic{background:#2a1a3a;color:#d8b4fe;border:1px solid #4a2a6a}
.btn-mic.rec{background:#5a1a3a;color:#ff6b8a;border-color:#ff6b8a;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,138,.3)}50%{box-shadow:0 0 0 10px rgba(255,107,138,0)}}
.btn-s{background:#1a2a4a;color:#8899bb;border:1px solid #2a3a5c}
.btn-sk{background:transparent;color:#6a8ab0;border:1px solid #2a3a5c}
.btn-back{width:auto;padding:8px 16px;margin-bottom:12px;background:transparent;border:1px solid #2a3a5c;border-radius:10px;color:#6a8ab0;font-size:14px;cursor:pointer}

/* Result */
.res{background:#0e1a30;border:1px solid #2a3a5c;border-radius:12px;padding:16px;margin-bottom:12px}
.res-label{font-size:13px;color:#6a8ab0;margin-bottom:6px}
.res-text{font-size:16px;line-height:1.6}
.w-ok{color:#2d7}.w-no{color:#ff6b8a;background:rgba(255,107,138,.12);padding:2px 4px;border-radius:4px}
.sc{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:14px;font-weight:600;margin-bottom:12px}
.sc-g{background:#1a4a2a;color:#2d7}.sc-y{background:#3a3a1a;color:#ed2}.sc-r{background:#4a1a1a;color:#ff6b8a}

/* Home */
.home-card{background:#121e36;border:1px solid #1e3050;border-radius:16px;padding:20px;margin-bottom:12px;cursor:pointer;transition:all .2s}
.home-card:hover{border-color:#5bf;transform:translateY(-2px)}
.home-card h3{color:#5bf;font-size:16px;margin-bottom:6px}
.home-card p{color:#6a8ab0;font-size:13px;line-height:1.5}
.home-title{text-align:center;margin-bottom:20px}
.home-title h1{font-size:22px;color:#5bf;margin-bottom:4px}
.home-title p{color:#6a8ab0;font-size:13px}
.stats-row{display:flex;gap:10px;margin-bottom:16px}
.stat-box{flex:1;background:#121e36;border:1px solid #1e3050;border-radius:12px;padding:12px;text-align:center}
.stat-num{font-size:24px;font-weight:700;color:#5bf}
.stat-label{font-size:11px;color:#6a8ab0}

/* Category filter */
.cat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-btn{padding:6px 12px;border:1px solid #2a3a5c;background:#121e36;color:#8899bb;border-radius:20px;font-size:12px;cursor:pointer}
.cat-btn.on{background:#1a3a6a;color:#5bf;border-color:#5bf}

/* Fill blank */
.fill-line{font-size:18px;line-height:2;color:#f0f0f0;margin-bottom:8px}
.blank-inp{display:inline-block;background:transparent;border:none;border-bottom:2px solid #5bf;color:#5bf;font-size:16px;font-weight:600;width:auto;min-width:140px;padding:2px 4px;outline:none;font-family:inherit}

/* Sentence frame */
.frame{font-size:15px;color:#5bf;background:#0e1a30;border:1px solid #1e3050;border-radius:10px;padding:10px 14px;margin-bottom:12px;line-height:1.8}
.frame strong{color:#fb3}

/* Show/hide */
.hidden{display:none!important}
.show-link{text-align:center;margin-top:8px}
.show-link a{color:#5bf;font-size:13px;cursor:pointer;text-decoration:underline}

/* Install */
.install-banner{background:linear-gradient(135deg,#1a3a6a,#2a5a9a);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.install-banner p{font-size:13px;color:#d0e0f0;flex:1}
.install-banner button{padding:8px 16px;background:#5bf;color:#0a1628;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}

/* Review mode */
.tab-row{display:flex;gap:4px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tab-row::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:8px 14px;border:1px solid #2a3a5c;background:#121e36;color:#8899bb;border-radius:10px;font-size:13px;cursor:pointer;white-space:nowrap}
.tab-btn.on{background:#1a3a6a;color:#5bf;border-color:#5bf}
.rv-item{background:#121e36;border:1px solid #1e3050;border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:flex-start;gap:12px}
.rv-num{color:#5bf;font-weight:700;font-size:14px;min-width:28px;text-align:right;padding-top:2px}
.rv-body{flex:1}
.rv-en{font-size:15px;color:#f0f0f0;margin-bottom:4px;line-height:1.4}
.rv-zh{font-size:13px;color:#6a8ab0}
.rv-past{font-size:12px;color:#8a7ab0;margin-top:3px}
.rv-play{width:36px;height:36px;border-radius:50%;border:1.5px solid #5bf;background:transparent;color:#5bf;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:center}
.rv-play:hover{background:#1a3a6a}
.rv-search{width:100%;padding:10px 14px;background:#0e1a30;border:1px solid #2a3a5c;border-radius:10px;color:#f0f0f0;font-size:15px;outline:none;margin-bottom:12px}
.rv-search:focus{border-color:#5bf}
.rv-search::placeholder{color:#4a6080}
.rv-active{border-color:#5bf!important;background:#0e1a30!important;box-shadow:0 0 12px rgba(85,187,255,.15)}
.btn-stop{background:linear-gradient(135deg,#8a2a3a,#c44);color:#fff}
</style>

const CATS = {routine:"每日例行 Routine", home:"家務整理 Home", school:"工作學校 Work & School", social:"社交休閒 Social"};
const CAT_COLORS = {routine:"b-blue", home:"b-green", school:"b-orange", social:"b-purple"};

// State
let S = {
  mode:'home', idx:0, queue:[], score:{ok:0, total:0},
  speed:0.75, cat:null, showResult:false, answer:'', recognized:'', isRec:false,
  tense:'future' // future or past
};

// ============ RENDER ============
function render() {
  const app = document.getElementById('app');

    home: renderHome,
    review: renderReview,
    shadow: renderShadow,
    fillPhrase: renderFillPhrase,
    fullSentence: renderFullSentence,

  }[S.mode]();
  bindEvents();
}

    </div>
  `;
}

function start(mode) {
  S.mode = mode;
  S.idx = 0;
  S.score = {ok:0, total:0};
  S.showResult = false;
  S.answer = '';
  S.recognized = '';
  // Build queue: prioritize study-abroad phrases (70%)
  let pool = [...DATA];
  if (S.cat) pool = pool.filter(p => p.cat === S.cat);
  const sa = pool.filter(p => p.sa);
  const other = pool.filter(p => !p.sa);
  const saCount = Math.min(sa.length, Math.ceil(12 * 0.7));
  const otherCount = 12 - saCount;
  S.queue = shuffle(sa).slice(0, saCount).concat(shuffle(other).slice(0, otherCount));
  S.queue = shuffle(S.queue).slice(0, 12);
  render();
}

// ============ REVIEW MODE ============

    ${isPlaying ? `

    ${isPlaying ? `<div style="text-align:center;margin-bottom:12px"><span class="badge ${S._autoPlayTense==='past'?'b-purple':'b-blue'}">&#127925; ${S._autoPlayTense==='past'?'過去式':'未來式'} 第 ${items.findIndex(p=>p.id===currentId)+1}/${items.length} 句</span></div>` : ''}
    <div>

    ${items.length===0?'<p style="text-align:center;color:#6a8ab0;padding:20px">沒有找到符合的短句</p>':''}

}

// ============ MISTAKES MODE ============
function getMistakes() {
  try { return JSON.parse(localStorage.getItem('mistakes') || '[]'); } catch(e) { return []; }
}
function addMistake(id) {
  const m = getMistakes();
  if (!m.includes(id)) { m.push(id); localStorage.setItem('mistakes', JSON.stringify(m)); }
}
function removeMistake(id) {
  const m = getMistakes().filter(x => x !== id);
  localStorage.setItem('mistakes', JSON.stringify(m));
}
function startMistakes() {
  const m = getMistakes();
  if (m.length === 0) { alert('還沒有常錯題！先去練習幾輪吧。'); return; }
  S.mode = 'morningEvening';
  S.idx = 0;
  S.score = {ok:0, total:0};
  S.showResult = false;
  S.answer = '';
  S.recognized = '';
  S._tenseSet = false;
  S._isMistakeMode = true;
  S.queue = shuffle(DATA.filter(p => m.includes(p.id))).slice(0, 12);
  render();
}

// ============ MORNING/EVENING MODE (CORE) ============
function renderMorningEvening() {
  if (S.idx >= S.queue.length) return renderDone();
  const p = S.queue[S.idx];
  const pct = (S.idx / S.queue.length) * 100;

  // Randomly pick future or past tense
  if (!S.showResult && !S._tenseSet) {
    S.tense = Math.random() > 0.5 ? 'future' : 'past';
    S._tenseSet = true;
  }

  const isFuture = S.tense === 'future';
  const correctSentence = isFuture
    ? `I'm going to ${p.en}.`
    : `I ${p.past}.`;
  const altSentence = isFuture
    ? null
    : `I was going to ${p.en}.`;

  let resultHTML = '';
  if (S.showResult) {
    const comp = compareWords(S.answer, correctSentence);
    const altComp = altSentence ? compareWords(S.answer, altSentence) : null;
    const bestComp = (altComp && altComp.score > comp.score) ? altComp : comp;
    const bestAnswer = (altComp && altComp.score > comp.score) ? altSentence : correctSentence;
    const sc = bestComp.score;
    const cls = sc >= 85 ? 'sc-g' : sc >= 50 ? 'sc-y' : 'sc-r';
    resultHTML = `
      <div class="res">
        <div class="res-label">&#10004; 正確答案：</div>
        <div class="res-text" style="color:#2d7;font-size:17px">${correctSentence}</div>
        ${altSentence ? `<div class="res-text" style="color:#8ab;font-size:14px;margin-top:4px">或：${altSentence}</div>` : ''}
      </div>
      <div class="res">
        <div class="res-label">你的答案：</div>
        <div class="res-text">${bestComp.html}</div>
      </div>
      <div class="sc ${cls}">${bestComp.ok}/${bestComp.total} · ${sc}%</div>
      <div class="audio-row">
        <button class="btn-play" onclick="speak('${esc(correctSentence)}')">&#9654;</button>
        <span style="color:#6a8ab0;font-size:13px">聽正確句子</span>
      </div>
      <button class="btn btn-p" onclick="next()">下一題 &#8594;</button>
    `;
  }

  return `
    <button class="btn-back" onclick="goHome()">&#8592; 返回</button>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-text">${S.idx+1}/${S.queue.length} 題 · 答對 ${S.score.ok}</div>
    <div class="card">
      <span class="badge ${isFuture?'b-blue':'b-purple'}">${isFuture?'&#9728;&#65039; 早安法（未來式）':'&#127769; 晚安法（過去式）'}</span>
      <span class="badge ${CAT_COLORS[p.cat]}">${CATS[p.cat]}</span>
      ${p.sa?'<span class="badge b-orange">留學生常用</span>':''}
      <div class="card-zh" style="font-size:18px;margin-top:8px;margin-bottom:12px"><strong>${p.zh}</strong></div>
      <div class="frame">
        ${isFuture
          ? `<strong>I'm going to</strong> __________.`
          : `<strong>I + 過去式動詞</strong> __________.<br><span style="font-size:13px;color:#6a8ab0">或 <strong>I was going to</strong> __________.</span>`
        }
      </div>
    </div>
    ${!S.showResult ? `
      <div style="margin-bottom:12px">
        <textarea class="inp" id="main-inp" placeholder="${isFuture ? "I'm going to ..." : "I V-ed ... 或 I was going to ..."}" oninput="S.answer=this.value">${esc(S.answer)}</textarea>
      </div>
      <button class="btn btn-p" onclick="checkME()">確認送出</button>
      <button class="btn btn-sk" onclick="skip()">跳過</button>
    ` : resultHTML}
  `;
}

function checkME() {
  if (!S.answer.trim()) { alert('請輸入句子！'); return; }
  const p = S.queue[S.idx];
  const isFuture = S.tense === 'future';
  const correct = isFuture ? `I'm going to ${p.en}.` : `I ${p.past}.`;
  const alt = isFuture ? null : `I was going to ${p.en}.`;
  const comp = compareWords(S.answer, correct);
  const altComp = alt ? compareWords(S.answer, alt) : null;
  const best = (altComp && altComp.score > comp.score) ? altComp.score : comp.score;
  S.score.total++;
  if (best >= 60) { S.score.ok++; removeMistake(p.id); }
  else { addMistake(p.id); }
  S.showResult = true;
  render();
}

      <button class="btn btn-sk" onclick="skip()">跳過</button>
    ` : resultHTML}
  `;
}

function checkFill() {
  if (!S.answer.trim()) { alert('請輸入！'); return; }
  const p = S.queue[S.idx];
  const comp = compareWords(S.answer, p.en);
  S.score.total++;
  if (comp.score >= 60) { S.score.ok++; removeMistake(p.id); }
  else { addMistake(p.id); }
  S.showResult = true;
  render();
}

        <button class="spd ${S.speed===0.5?'on':''}" onclick="setSpd(0.5)">0.5X</button>
      </div>
    </div>
    ${!S.showResult ? `
      <button class="btn btn-mic ${S.isRec?'rec':''}" onclick="toggleRec()">
        ${S.isRec?'&#9899; 錄音中... 點擊停止':'&#127908; 開始跟讀（語音辨識）'}
      </button>
      <div style="margin-bottom:12px">
        <input class="inp" id="main-inp" placeholder="或在此打字輸入..." value="${esc(S.answer)}" oninput="S.answer=this.value">
      </div>
      <button class="btn btn-p" onclick="checkShadow()">確認送出</button>
      <button class="btn btn-sk" onclick="skip()">跳過</button>
    ` : resultHTML}
  `;
}

function checkShadow() {
  const ans = S.answer || S.recognized;
  if (!ans.trim()) { alert('請先跟讀或打字！'); return; }
  S.recognized = ans;
  const p = S.queue[S.idx];
  const sentence = `I'm going to ${p.en}.`;
  const comp = compareWords(ans, sentence);
  S.score.total++;
  if (comp.score >= 60) { S.score.ok++; removeMistake(p.id); }
  else { addMistake(p.id); }
  S.showResult = true;
  render();
}

// ============ FULL SENTENCE LISTEN & WRITE ============
function renderFullSentence() {
  if (S.idx >= S.queue.length) return renderDone();
  const p = S.queue[S.idx];
  const pct = (S.idx / S.queue.length) * 100;
  // Alternate between future and past
  if (!S.showResult && !S._tenseSet) {
    S.tense = Math.random() > 0.5 ? 'future' : 'past';
    S._tenseSet = true;
  }
  const isFuture = S.tense === 'future';
  const sentence = isFuture ? `I'm going to ${p.en}.` : `I ${p.past}.`;

  let resultHTML = '';
  if (S.showResult) {
    const comp = compareWords(S.answer, sentence);
    const sc = comp.score;
    const cls = sc >= 85 ? 'sc-g' : sc >= 50 ? 'sc-y' : 'sc-r';
    resultHTML = `
      <div class="res">
        <div class="res-label">正確答案：</div>
        <div class="res-text" style="color:#2d7">${sentence}</div>
      </div>
      <div class="res">
        <div class="res-label">你的答案：</div>
        <div class="res-text">${comp.html}</div>
      </div>
      <div class="sc ${cls}">${comp.ok}/${comp.total} · ${sc}%</div>
      <button class="btn btn-p" onclick="next()">下一題 &#8594;</button>
    `;
  }

  return `
    <button class="btn-back" onclick="goHome()">&#8592; 返回</button>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-text">${S.idx+1}/${S.queue.length} 題</div>
    <div class="card">
      <span class="badge ${isFuture?'b-blue':'b-purple'}">${isFuture?'聽寫（未來式）':'聽寫（過去式）'}</span>
      <span class="badge ${CAT_COLORS[p.cat]}">${CATS[p.cat]}</span>
      <div class="card-zh" style="font-size:16px;margin-top:8px">${p.zh}</div>
      <div class="audio-row" style="margin-top:12px">
        <button class="btn-play" onclick="speak('${esc(sentence)}')">&#9654;</button>
        <span style="color:#6a8ab0;font-size:13px">&#128266; 聽完整句子後打出來</span>
      </div>
    </div>
    ${!S.showResult ? `
      <div style="margin-bottom:12px">
        <textarea class="inp" id="main-inp" placeholder="打出你聽到的完整句子..." oninput="S.answer=this.value">${esc(S.answer)}</textarea>
      </div>
      <button class="btn btn-p" onclick="checkFull()">確認送出</button>
      <button class="btn btn-sk" onclick="skip()">跳過</button>
    ` : resultHTML}
  `;
}

function checkFull() {
  if (!S.answer.trim()) { alert('請輸入！'); return; }
  const p = S.queue[S.idx];
  const isFuture = S.tense === 'future';
  const sentence = isFuture ? `I'm going to ${p.en}.` : `I ${p.past}.`;
  const comp = compareWords(S.answer, sentence);
  S.score.total++;
  if (comp.score >= 60) { S.score.ok++; removeMistake(p.id); }
  else { addMistake(p.id); }
  S.showResult = true;
  render();
}

// ============ DONE ============
function renderDone() {
  const t = S.score.total, o = S.score.ok;
  const pct = t > 0 ? Math.round((o/t)*100) : 0;
  localStorage.setItem('tp', +(localStorage.getItem('tp')||0) + t);
  return `
    <div style="text-align:center;padding:20px">
      <div style="font-size:64px;margin-bottom:12px">&#127881;</div>
      <h2 style="color:#5bf;margin-bottom:8px">練習完成！</h2>
      <p style="color:#6a8ab0;margin-bottom:24px">完成 ${t} 題練習</p>
      <div class="stats-row">
        <div class="stat-box"><div class="stat-num">${o}</div><div class="stat-label">答對</div></div>
        <div class="stat-box"><div class="stat-num">${t-o}</div><div class="stat-label">答錯</div></div>
        <div class="stat-box"><div class="stat-num">${pct}%</div><div class="stat-label">正確率</div></div>
      </div>
      <button class="btn btn-p" onclick="start('${S.mode}')">再練一次</button>
      <button class="btn btn-s" onclick="goHome()">回首頁</button>
    </div>
  `;
}

// ============ ACTIONS ============
function goHome() { S.mode='home'; S._isMistakeMode=false; render(); }
function setSpd(s) { S.speed=s; render(); }
function next() { S.idx++; S.showResult=false; S.answer=''; S.recognized=''; S._tenseSet=false; render(); if(S.idx<S.queue.length&&(S.mode==='shadow'||S.mode==='fullSentence')){const p=S.queue[S.idx];const isFuture=Math.random()>0.5;S.tense=isFuture?'future':'past';S._tenseSet=true;const sen=isFuture?`I'm going to ${p.en}.`:`I ${p.past}.`;setTimeout(()=>speak(sen),500);}}
function skip() { S.score.total++; next(); }

// iOS Safari requires user gesture to unlock speechSynthesis
let _audioUnlocked = false;
function unlockAudio() {
  if (_audioUnlocked) return;
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  speechSynthesis.speak(u);
  _audioUnlocked = true;
}
document.addEventListener('touchstart', unlockAudio, {once: true});
document.addEventListener('click', unlockAudio, {once: true});

function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=S.speed;
  const v=speechSynthesis.getVoices();
  const uv=v.find(x=>x.lang==='en-US'&&x.name.includes('Samantha'))||v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'));
  if(uv)u.voice=uv;
  speechSynthesis.speak(u);
}

// For review mode - direct call from button tap (user gesture)
function speakTouch(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=S.speed;
  const v=speechSynthesis.getVoices();
  const uv=v.find(x=>x.lang==='en-US'&&x.name.includes('Samantha'))||v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'));
  if(uv)u.voice=uv;
  speechSynthesis.speak(u);
}

// ============ AUTO PLAY ALL ============
function startAutoPlay(tense) {
  const cat = S.reviewCat || 'routine';
  const search = (S.reviewSearch || '').toLowerCase();
  let items = search
    ? DATA.filter(p => p.zh.includes(search) || p.en.toLowerCase().includes(search) || p.past.toLowerCase().includes(search))
    : DATA.filter(p => p.cat === cat);
  if (items.length === 0) return;
  S._autoPlaying = true;
  S._autoPlayItems = items;
  S._autoPlayIdx = 0;
  S._autoPlayTense = tense || 'future';
  playNextInSequence();
}

function playNextInSequence() {
  if (!S._autoPlaying) return;
  const items = S._autoPlayItems;
  const idx = S._autoPlayIdx;
  if (idx >= items.length) { stopAutoPlay(); return; }
  const p = items[idx];
  S._autoPlayId = p.id;
  render();
  // Scroll the active item into view
  setTimeout(() => {
    const el = document.getElementById('rv-' + p.id);
    if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 100);
  // Speak based on tense
  speechSynthesis.cancel();
  const sentence = S._autoPlayTense === 'past'
    ? "I " + p.past + "."
    : "I'm going to " + p.en + ".";
  const u = new SpeechSynthesisUtterance(sentence);
  u.lang = 'en-US';
  u.rate = S.speed;
  const v = speechSynthesis.getVoices();
  const uv = v.find(x=>x.lang==='en-US'&&x.name.includes('Samantha'))||v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'));
  if (uv) u.voice = uv;
  u.onend = () => {
    if (!S._autoPlaying) return;
    // Pause 1.5s between sentences
    S._autoPlayTimer = setTimeout(() => {
      S._autoPlayIdx++;
      playNextInSequence();
    }, 1500);
  };
  speechSynthesis.speak(u);
}

function stopAutoPlay() {
  S._autoPlaying = false;
  S._autoPlayId = null;
  speechSynthesis.cancel();
  if (S._autoPlayTimer) { clearTimeout(S._autoPlayTimer); S._autoPlayTimer = null; }
  render();
}

function toggleRec() {
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){alert('請使用 Chrome 瀏覽器以支援語音辨識');return;}
  if(S.isRec){if(window._rec)window._rec.stop();S.isRec=false;render();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const r=new SR();r.lang='en-US';r.continuous=false;r.interimResults=false;
  r.onresult=e=>{S.recognized=e.results[0][0].transcript;S.answer=S.recognized;S.isRec=false;render();};
  r.onerror=()=>{S.isRec=false;render();};
  r.onend=()=>{S.isRec=false;};
  r.start();window._rec=r;S.isRec=true;render();
}

function bindEvents() {
  const inp=document.getElementById('main-inp');
  if(inp)setTimeout(()=>inp.focus(),100);
  document.querySelectorAll('input,textarea').forEach(el=>{
    el.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();
        if(S.mode==='morningEvening')checkME();
        else if(S.mode==='fillPhrase')checkFill();
        else if(S.mode==='shadow')checkShadow();
        else if(S.mode==='fullSentence')checkFull();
      }
    });
  });
}

// ============ UTILITIES ============
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function compareWords(user, correct) {
  const cu=user.toLowerCase().replace(/[.,!?;:'"]/g,'').trim().split(/\s+/).filter(Boolean);
  const cc=correct.toLowerCase().replace(/[.,!?;:'"]/g,'').trim().split(/\s+/).filter(Boolean);
  const cw=correct.split(/\s+/);
  let ok=0;const html=[];
  cc.forEach((w,i)=>{
    if(cu.includes(w)){ok++;html.push(`<span class="w-ok">${cw[i]||w}</span>`);}
    else{html.push(`<span class="w-no">${cu[i]||'___'}</span>`);}
  });
  return {score:Math.round((ok/cc.length)*100),ok,total:cc.length,html:html.join(' ')};
}

speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();

// PWA
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});

render();
</script>
